; Alembic configuration — run from the repository root:
;   alembic upgrade head
;   alembic revision --autogenerate -m "..."
;   alembic check
;
; There is deliberately no `sqlalchemy.url` here. The connection string is built in
; data/migrations/env.py from POSTGRES_ADMIN_USER / POSTGRES_ADMIN_PASSWORD /
; POSTGRES_HOST / POSTGRES_PORT / POSTGRES_DB so that the same migrations run
; unchanged against local Docker Postgres and Cloud SQL (ADR-007), and so no
; credential ever lands in a tracked file.

[alembic]
script_location = data/migrations
prepend_sys_path = .
path_separator = os

; Timestamped, readable revision filenames: 20260920_1430-ab12cd34_initial_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = ruff
# exec runner on the venv's ruff binary. The console_scripts runner failed ("Could not find
# entrypoint console_scripts.ruff") because ruff ships as a compiled binary with no Python
# entry point. This path is the Windows venv layout; on POSIX use %(here)s/.venv/bin/ruff.
ruff.type = exec
ruff.executable = %(here)s/.venv/Scripts/ruff.exe
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
