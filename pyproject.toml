[project]
name = "agentic-service-ops"
version = "0.1.0"
description = "Agentic Service Operations Intelligence Platform — Northwestern capstone"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Offline data tooling under data/generator/ — never installed into a runtime service.
# google-genai is pinned exactly: corpus provenance (ADR-030) records the SDK version.
# numpy is pinned exactly too: seeded generation is only bit-for-bit reproducible within
# one numpy version (some distribution samplers may change between releases).
# datasketch: MinHash LSH for corpus-wide near-duplicate rejection (ADR-036).
# tzdata: the daily request cap counts by Pacific-time day (Gemini quota reset); Windows
# Python ships no tz database without it.
generator = [
    "datasketch==2.0.0",
    "google-genai==2.25.0",
    "matplotlib==3.11.2",  # validate.py plots
    "numpy==2.5.3",
    "python-dotenv>=1.0",
    "scipy==1.18.1",  # datasketch dependency, pinned so the dedup path is reproducible
    "tzdata==2026.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Root is a workspace container, not a distributable package.
bypass-selection = true

# uv workspace: `uv.lock` pins every dependency of every member, and CI and the
# service images install from it (ADR-047). Members are listed explicitly because the
# placeholder directories under packages/ and services/ have no pyproject.toml yet;
# add each new service here when it gets one.
[tool.uv.workspace]
members = [
    "packages/db_models",
    "packages/common",
    "packages/schemas",
    "services/mcp_incidents",
    "services/agent_reporting",
    "services/orchestrator",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic revision scripts are generated-shaped: unused imports and long
# auto-written identifiers are expected.
"data/migrations/versions/*.py" = ["E501", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services"]
pythonpath = ["packages/db_models/src"]
addopts = "-ra"
markers = [
    "integration: needs a live, migrated Postgres; skips when none is reachable",
    "e2e: needs the docker-compose stack up and loaded; skipped unless RUN_E2E=1",
]

[tool.mypy]
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin"]
warn_unused_ignores = true
