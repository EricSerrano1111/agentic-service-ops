[project]
name = "agentic-service-ops"
version = "0.1.0"
description = "Agentic Service Operations Intelligence Platform — Northwestern capstone"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Offline data tooling under data/generator/ — never installed into a runtime service.
# google-genai is pinned exactly: corpus provenance (ADR-030) records the SDK version.
generator = ["google-genai==2.25.0", "python-dotenv>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Root is a workspace container, not a distributable package.
bypass-selection = true

# Picked up by uv if/when the toolchain moves off plain pip. Ignored by pip today,
# so adding it now costs nothing and avoids restructuring later.
[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic revision scripts are generated-shaped: unused imports and long
# auto-written identifiers are expected.
"data/migrations/versions/*.py" = ["E501", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
pythonpath = ["packages/db_models/src"]
addopts = "-ra"
markers = [
    "integration: needs a live, migrated Postgres; skips when none is reachable",
]

[tool.mypy]
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin"]
warn_unused_ignores = true
