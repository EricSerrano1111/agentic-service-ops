# Cloud Run service "ops-orchestrator". Same v2 resource format as reporting.yaml.
# It calls the reporting service with a Google ID token (A2A_AUTH=google_id_token), on the
# Agent Card fetch and the message call alike. It holds the Gemini key and no database
# credentials, and has no Cloud SQL mount.
#
# All four callees are named here (ADR-099): reporting, sentiment, forecast and QA, each by its
# deterministic service URL, which is also the ID token's audience (ADR-081). A callee that is
# not deployed (sentiment, if _DEPLOY_SENTIMENT is false) answers "agent unavailable". Its invoker is
# run-gateway (ADR-097); it is not public.
name: projects/${PROJECT_ID}/locations/${REGION}/services/ops-orchestrator
description: Orchestrator that routes questions to specialist agents over A2A
labels:
  app: agentic-service-ops
  component: deploy # lets billing reports separate deploy cost from paid inference (ADR-083)
ingress: INGRESS_TRAFFIC_ALL # IAM is the boundary in this deploy (ADR-081)
invokerIamDisabled: false
template:
  serviceAccount: ${ORCHESTRATOR_SA} # dedicated; never the default compute account
  timeout: 300s # at least 120 s (TA-16)
  scaling:
    minInstanceCount: 0
    maxInstanceCount: 3
  maxInstanceRequestConcurrency: 8
  containers:
    - name: orchestrator
      image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/orchestrator:${IMAGE_TAG}
      ports:
        - containerPort: 8080
      env:
        - name: ORCHESTRATOR_PORT
          value: "8080"
        - name: A2A_AUTH
          value: google_id_token
        - name: AGENT_REPORTING_URL
          value: https://ops-reporting-${PROJECT_NUMBER}.${REGION}.run.app
        - name: AGENT_SENTIMENT_URL
          value: https://ops-sentiment-${PROJECT_NUMBER}.${REGION}.run.app
        - name: AGENT_FORECAST_URL
          value: https://ops-forecast-${PROJECT_NUMBER}.${REGION}.run.app
        - name: AGENT_QA_URL
          value: https://ops-qa-${PROJECT_NUMBER}.${REGION}.run.app
        - name: A2A_TIMEOUT_S
          value: "60"
        - name: ROUTE_TIMEOUT_S
          value: "30"
        - name: LLM_MODE
          value: paid # ADR-104; the free key stays mounted beside the paid one (revert is one env change)
        - name: GEMINI_MODEL_ORCHESTRATOR
          value: ${GEMINI_MODEL_ORCHESTRATOR}
        - name: LOG_LEVEL
          value: INFO
        - name: GOOGLE_AI_API_KEY
          valueSource:
            secretKeyRef:
              secret: gemini-api-key
              version: latest
        - name: GOOGLE_AI_API_KEY_PAID
          valueSource:
            secretKeyRef:
              secret: gemini-api-key-paid
              version: latest
        - name: LLM_MAX_REQUESTS
          value: "1500"
        - name: LLM_MAX_SPEND_USD
          value: "1.00"
      resources:
        limits:
          cpu: "1"
          memory: 512Mi
      startupProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 2
        periodSeconds: 3
        timeoutSeconds: 3
        failureThreshold: 20
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
