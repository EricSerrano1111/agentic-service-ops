# Cloud Run service "ops-sentiment": the sentiment agent (ingress) plus its MCP server
# (sidecar). Same v2 resource format and the same shape as reporting.yaml (ADR-079, ADR-099).
# The Cloud SQL socket exists only inside mcp-feedback, the only container with the database
# password (app_sentiment). The agent holds the Gemini key (it makes one parse call).
#
# Scoring mode stored_only (ADR-100, resolves R-19): mcp-feedback is the `stored` image target,
# with no torch and no model weights. It answers from the predictions the offline backfill
# stored, after checking that every comment in range has one, and fails closed otherwise.
name: projects/${PROJECT_ID}/locations/${REGION}/services/ops-sentiment
description: Sentiment agent with the feedback MCP server as a sidecar
labels:
  app: agentic-service-ops
  component: deploy # lets billing reports separate deploy cost from paid inference (ADR-083)
ingress: INGRESS_TRAFFIC_ALL # IAM is the boundary in this deploy (ADR-081)
invokerIamDisabled: false # the --no-allow-unauthenticated equivalent
traffic: # 100% to the latest ready revision, so a deploy resets any manual pin (L-105)
  - type: TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST
    percent: 100
template:
  serviceAccount: ${SENTIMENT_SA} # dedicated; never the default compute account
  timeout: 300s # at least 120 s (TA-16)
  scaling:
    minInstanceCount: 0
    maxInstanceCount: 2 # connection arithmetic: ADR-099
  maxInstanceRequestConcurrency: 8
  volumes:
    - name: cloudsql
      cloudSqlInstance:
        instances:
          - ${CLOUD_SQL_INSTANCE}
  containers:
    - name: agent-sentiment
      image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/agent-sentiment:${IMAGE_TAG}
      ports:
        - containerPort: 8080
      dependsOn:
        - mcp-feedback # starts after the sidecar's startup probe passes
      env:
        - name: AGENT_SENTIMENT_PORT
          value: "8080"
        - name: AGENT_SENTIMENT_PUBLIC_URL
          value: https://ops-sentiment-${PROJECT_NUMBER}.${REGION}.run.app/
        - name: MCP_FEEDBACK_URL
          value: http://localhost:8102/mcp
        - name: LLM_MODE
          value: paid # ADR-104; the free key stays mounted beside the paid one (revert is one env change)
        - name: GEMINI_MODEL_SPECIALIST
          value: ${GEMINI_MODEL_SPECIALIST}
        - name: LOG_LEVEL
          value: INFO
        - name: GOOGLE_AI_API_KEY
          valueSource:
            secretKeyRef:
              secret: gemini-api-key
              version: latest
        - name: GOOGLE_AI_API_KEY_PAID
          valueSource:
            secretKeyRef:
              secret: gemini-api-key-paid
              version: latest
        - name: LLM_MAX_REQUESTS
          value: "1500"
        - name: LLM_MAX_SPEND_USD
          value: "1.00"
      resources:
        limits:
          cpu: "1"
          memory: 512Mi
      startupProbe:
        httpGet:
          path: /readyz # ready when the MCP sidecar answers
          port: 8080
        initialDelaySeconds: 2
        periodSeconds: 3
        timeoutSeconds: 3
        failureThreshold: 40
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
    - name: mcp-feedback
      image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/mcp-feedback:${IMAGE_TAG}
      env:
        - name: MCP_FEEDBACK_PORT
          value: "8102"
        - name: CLOUD_SQL_INSTANCE
          value: ${CLOUD_SQL_INSTANCE}
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: ${POSTGRES_DB}
        - name: MCP_FEEDBACK_SCORING
          value: stored_only # ADR-100: no model, no scoring, fail closed on a gap
        - name: DB_ROLE_SENTIMENT_USER
          value: app_sentiment
        - name: LOG_LEVEL
          value: INFO
        - name: DB_ROLE_SENTIMENT_PASSWORD
          valueSource:
            secretKeyRef:
              secret: db-role-sentiment-password
              version: latest
      resources:
        limits:
          cpu: "1"
          memory: 512Mi # no model loaded (ADR-100); the value mcp-incidents runs at on this stack
      volumeMounts:
        - name: cloudsql
          mountPath: /cloudsql
      startupProbe:
        httpGet:
          path: /readyz # ready only when the manifest was read and the database answers
          port: 8102
        initialDelaySeconds: 2
        periodSeconds: 3
        timeoutSeconds: 3
        failureThreshold: 20 # same as mcp-incidents: start-up is a manifest read (ADR-100)
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8102
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
