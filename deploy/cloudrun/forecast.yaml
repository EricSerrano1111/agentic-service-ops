# Cloud Run service "ops-forecast": the forecast agent (ingress) plus its MCP server
# (sidecar). Same v2 resource format and shape as reporting.yaml (ADR-079, ADR-099). The Cloud
# SQL socket exists only inside mcp-volume, the only container with the database password
# (app_forecast). The volume_v2 parameter files are baked into the mcp-volume image and
# hash-checked at start-up (ADR-098). The agent holds the Gemini key (it makes one parse call).
name: projects/${PROJECT_ID}/locations/${REGION}/services/ops-forecast
description: Forecast agent with the volume MCP server as a sidecar
labels:
  app: agentic-service-ops
  component: deploy # lets billing reports separate deploy cost from paid inference (ADR-083)
ingress: INGRESS_TRAFFIC_ALL # IAM is the boundary in this deploy (ADR-081)
invokerIamDisabled: false # the --no-allow-unauthenticated equivalent
template:
  serviceAccount: ${FORECAST_SA} # dedicated; never the default compute account
  timeout: 300s # at least 120 s (TA-16)
  scaling:
    minInstanceCount: 0
    maxInstanceCount: 2 # connection arithmetic: ADR-099
  maxInstanceRequestConcurrency: 8
  volumes:
    - name: cloudsql
      cloudSqlInstance:
        instances:
          - ${CLOUD_SQL_INSTANCE}
  containers:
    - name: agent-forecast
      image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/agent-forecast:${IMAGE_TAG}
      ports:
        - containerPort: 8080
      dependsOn:
        - mcp-volume # starts after the sidecar's startup probe passes
      env:
        - name: AGENT_FORECAST_PORT
          value: "8080"
        - name: AGENT_FORECAST_PUBLIC_URL
          value: https://ops-forecast-${PROJECT_NUMBER}.${REGION}.run.app/
        - name: MCP_VOLUME_URL
          value: http://localhost:8103/mcp
        - name: LLM_MODE
          value: paid # ADR-104; the free key stays mounted beside the paid one (revert is one env change)
        - name: GEMINI_MODEL_SPECIALIST
          value: ${GEMINI_MODEL_SPECIALIST}
        - name: LOG_LEVEL
          value: INFO
        - name: GOOGLE_AI_API_KEY
          valueSource:
            secretKeyRef:
              secret: gemini-api-key
              version: latest
        - name: GOOGLE_AI_API_KEY_PAID
          valueSource:
            secretKeyRef:
              secret: gemini-api-key-paid
              version: latest
        - name: LLM_MAX_REQUESTS
          value: "1500"
        - name: LLM_MAX_SPEND_USD
          value: "1.00"
      resources:
        limits:
          cpu: "1"
          memory: 512Mi
      startupProbe:
        httpGet:
          path: /readyz # ready when the MCP sidecar answers
          port: 8080
        initialDelaySeconds: 2
        periodSeconds: 3
        timeoutSeconds: 3
        failureThreshold: 20
    - name: mcp-volume
      image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/mcp-volume:${IMAGE_TAG}
      env:
        - name: MCP_VOLUME_PORT
          value: "8103"
        - name: CLOUD_SQL_INSTANCE
          value: ${CLOUD_SQL_INSTANCE}
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: ${POSTGRES_DB}
        - name: DB_ROLE_FORECAST_USER
          value: app_forecast
        - name: LOG_LEVEL
          value: INFO
        - name: DB_ROLE_FORECAST_PASSWORD
          valueSource:
            secretKeyRef:
              secret: db-role-forecast-password
              version: latest
      resources:
        limits:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - name: cloudsql
          mountPath: /cloudsql
      startupProbe:
        httpGet:
          path: /readyz # ready only when the artifact verified and the database answers
          port: 8103
        initialDelaySeconds: 2
        periodSeconds: 3
        timeoutSeconds: 3
        failureThreshold: 20
