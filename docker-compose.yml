# Local development stack: Postgres plus the walking skeleton (Sprint 2):
#   orchestrator --A2A--> agent_reporting --MCP--> mcp_incidents --SQL--> postgres
#   orchestrator --A2A--> agent_sentiment --MCP--> mcp_feedback  --SQL--> postgres
#   orchestrator --A2A--> agent_forecast  --MCP--> mcp_volume    --SQL--> postgres
#
# Postgres stays local through Sprint 4; Cloud SQL is provisioned only from Sprint 5
# (ADR-007), because an always-on managed instance would consume roughly a third of
# the project budget for no benefit during local development.
#
#   docker compose up -d postgres
#   alembic upgrade head            # then load.py, see README
#   docker compose up -d --build
#
# Credentials: every value comes from .env by interpolation; nothing secret is written
# here. No service uses env_file, so each container sees only the variables listed
# under it. Only the MCP servers get database credentials, each only its own role's:
# mcp_incidents app_reporting's, mcp_feedback app_sentiment's, mcp_volume app_forecast's
# (ADR-023). Only the orchestrator and the three agents get the Gemini key, the free
# one: LLM_MODE is pinned to free and the paid key is never passed (ADR-048).
# tests/unit/test_compose_isolation.py asserts all of this.
#
# Ports: only the orchestrator publishes a host port among the application services.
# Postgres keeps its host port so migrations and the loader can run from the host.

services:
  postgres:
    # 16 rather than latest: Cloud SQL's supported versions should match what
    # development runs against, and pinning keeps the Sprint 5 migration boring.
    image: postgres:16
    container_name: service_ops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-service_ops}
    ports:
      # Localhost only, because dev passwords.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mcp_incidents:
    build:
      context: .
      dockerfile: services/mcp_incidents/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432" # the container port, not the host mapping above
      POSTGRES_DB: ${POSTGRES_DB:-service_ops}
      DB_ROLE_REPORTING_USER: ${DB_ROLE_REPORTING_USER:?set DB_ROLE_REPORTING_USER in .env}
      DB_ROLE_REPORTING_PASSWORD: ${DB_ROLE_REPORTING_PASSWORD:?set DB_ROLE_REPORTING_PASSWORD in .env}
      MCP_INCIDENTS_PORT: "8101"
      MCP_DB_STATEMENT_TIMEOUT_MS: ${MCP_DB_STATEMENT_TIMEOUT_MS:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8101"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mcp_feedback:
    build:
      context: .
      dockerfile: services/mcp_feedback/Dockerfile
    # The ADR-065 latency-proxy configuration: 1 CPU, 2 GiB, no swap.
    cpus: 1
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432" # the container port, not the host mapping above
      POSTGRES_DB: ${POSTGRES_DB:-service_ops}
      DB_ROLE_SENTIMENT_USER: ${DB_ROLE_SENTIMENT_USER:?set DB_ROLE_SENTIMENT_USER in .env}
      DB_ROLE_SENTIMENT_PASSWORD: ${DB_ROLE_SENTIMENT_PASSWORD:?set DB_ROLE_SENTIMENT_PASSWORD in .env}
      MODELS_DIR: /models/sentiment/bert_v1
      MCP_FEEDBACK_PORT: "8102"
      MCP_DB_STATEMENT_TIMEOUT_MS: ${MCP_DB_STATEMENT_TIMEOUT_MS:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Gitignored local artifacts, read-only; start-up verifies them against the
      # manifest baked into the image (ADR-062, ADR-067).
      - ./models:/models:ro
    expose:
      - "8102"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8102/healthz', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  agent_reporting:
    build:
      context: .
      dockerfile: services/agent_reporting/Dockerfile
    environment:
      MCP_INCIDENTS_URL: http://mcp_incidents:8101/mcp
      MCP_TIMEOUT_S: ${MCP_TIMEOUT_S:-15}
      PARSE_TIMEOUT_S: ${PARSE_TIMEOUT_S:-30}
      REPORTING_AS_OF_DATE: ${REPORTING_AS_OF_DATE:-}
      REPORTING_MIN_GROUP_DENOMINATOR: ${REPORTING_MIN_GROUP_DENOMINATOR:-20}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:?set GOOGLE_AI_API_KEY in .env}
      GEMINI_MODEL_SPECIALIST: ${GEMINI_MODEL_SPECIALIST:?set GEMINI_MODEL_SPECIALIST in .env}
      LLM_MODE: free
      AGENT_REPORTING_PUBLIC_URL: http://agent_reporting:8001/
      AGENT_REPORTING_PORT: "8001"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8001"
    depends_on:
      mcp_incidents:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  agent_sentiment:
    build:
      context: .
      dockerfile: services/agent_sentiment/Dockerfile
    # No database credentials: it reaches data only through mcp_feedback, and its one
    # LLM call (the parse) sees the question, never a customer comment (ADR-068).
    environment:
      MCP_FEEDBACK_URL: http://mcp_feedback:8102/mcp
      MCP_TIMEOUT_S: ${SENTIMENT_MCP_TIMEOUT_S:-45}
      PARSE_TIMEOUT_S: ${PARSE_TIMEOUT_S:-30}
      REPORTING_AS_OF_DATE: ${REPORTING_AS_OF_DATE:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:?set GOOGLE_AI_API_KEY in .env}
      GEMINI_MODEL_SPECIALIST: ${GEMINI_MODEL_SPECIALIST:?set GEMINI_MODEL_SPECIALIST in .env}
      LLM_MODE: free
      AGENT_SENTIMENT_PUBLIC_URL: http://agent_sentiment:8002/
      AGENT_SENTIMENT_PORT: "8002"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8002"
    depends_on:
      mcp_feedback:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mcp_volume:
    build:
      context: .
      dockerfile: services/mcp_volume/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432" # the container port, not the host mapping above
      POSTGRES_DB: ${POSTGRES_DB:-service_ops}
      DB_ROLE_FORECAST_USER: ${DB_ROLE_FORECAST_USER:?set DB_ROLE_FORECAST_USER in .env}
      DB_ROLE_FORECAST_PASSWORD: ${DB_ROLE_FORECAST_PASSWORD:?set DB_ROLE_FORECAST_PASSWORD in .env}
      MODELS_DIR: /models/forecast/volume_v2
      MCP_VOLUME_PORT: "8103"
      MCP_DB_STATEMENT_TIMEOUT_MS: ${MCP_DB_STATEMENT_TIMEOUT_MS:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Gitignored local artifact, read-only; start-up verifies it against the manifest
      # baked into the image (ADR-062, ADR-072).
      - ./models/forecast:/models/forecast:ro
    expose:
      - "8103"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8103/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  agent_forecast:
    build:
      context: .
      dockerfile: services/agent_forecast/Dockerfile
    # No database credentials: it reaches data only through mcp_volume (ADR-072).
    environment:
      MCP_VOLUME_URL: http://mcp_volume:8103/mcp
      MCP_TIMEOUT_S: ${FORECAST_MCP_TIMEOUT_S:-20}
      PARSE_TIMEOUT_S: ${PARSE_TIMEOUT_S:-30}
      REPORTING_AS_OF_DATE: ${REPORTING_AS_OF_DATE:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:?set GOOGLE_AI_API_KEY in .env}
      GEMINI_MODEL_SPECIALIST: ${GEMINI_MODEL_SPECIALIST:?set GEMINI_MODEL_SPECIALIST in .env}
      LLM_MODE: free
      AGENT_FORECAST_PUBLIC_URL: http://agent_forecast:8003/
      AGENT_FORECAST_PORT: "8003"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8003"
    depends_on:
      mcp_volume:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
      AGENT_REPORTING_URL: http://agent_reporting:8001
      AGENT_SENTIMENT_URL: http://agent_sentiment:8002
      AGENT_FORECAST_URL: http://agent_forecast:8003
      FORECAST_A2A_TIMEOUT_S: ${FORECAST_A2A_TIMEOUT_S:-60}
      SENTIMENT_A2A_TIMEOUT_S: ${SENTIMENT_A2A_TIMEOUT_S:-85}
      ROUTE_TIMEOUT_S: ${ROUTE_TIMEOUT_S:-30}
      A2A_TIMEOUT_S: ${A2A_TIMEOUT_S:-60}
      REPORTING_AS_OF_DATE: ${REPORTING_AS_OF_DATE:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:?set GOOGLE_AI_API_KEY in .env}
      GEMINI_MODEL_ORCHESTRATOR: ${GEMINI_MODEL_ORCHESTRATOR:?set GEMINI_MODEL_ORCHESTRATOR in .env}
      LLM_MODE: free
      ORCHESTRATOR_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    depends_on:
      agent_reporting:
        condition: service_healthy
      agent_sentiment:
        condition: service_healthy
      agent_forecast:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
