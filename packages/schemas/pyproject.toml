[project]
name = "service-ops-schemas"
version = "0.1.0"
description = "Pydantic contracts shared across services (ADR-026): MCP tool results and agent payloads"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemas"]
