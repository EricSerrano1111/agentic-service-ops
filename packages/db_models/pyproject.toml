[project]
name = "db-models"
version = "0.1.0"
description = "SQLAlchemy models and the per-role access matrix for the service-ops schema"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13",
    # psycopg 3 rather than psycopg2: actively maintained, and the SQLAlchemy URL
    # scheme is postgresql+psycopg://. The migration in 0002 also uses psycopg.sql
    # for safe literal quoting of role passwords.
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db_models"]
