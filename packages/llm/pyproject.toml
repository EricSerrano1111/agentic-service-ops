[project]
name = "service-ops-llm"
version = "0.1.0"
description = "The one LLM client every agent uses: Gemini, free by default, metered, typed errors (ADR-048)"
requires-python = ">=3.12"
# google-genai is pinned to the version build_corpus.py and the corpus provenance use
# (ADR-030), so the two never drift apart.
dependencies = [
    "google-genai==2.25.0",
    "pydantic>=2.11",
    "service-ops-common",
]

# Siblings resolve to the workspace members, never PyPI.
[tool.uv.sources]
service-ops-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]
