[project]
name = "forecast-runtime"
version = "0.1.0"
description = "The forecast prediction path shared by ml/forecast and mcp_volume: no fitting, numpy only (ADR-062, ADR-072)"
requires-python = ">=3.12"
# numpy shares the ml extra's exact pin, so serving and evaluation compute identically.
dependencies = [
    "numpy==2.5.3",
    "service-ops-schemas",
]

# Siblings resolve to the workspace members, never PyPI.
[tool.uv.sources]
service-ops-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_runtime"]
