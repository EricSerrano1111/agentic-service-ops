[project]
name = "api-gateway"
version = "0.1.0"
description = "Gateway: invite-link access, the single-screen UI's static files and /api to the orchestrator"
requires-python = ">=3.12"
# No model SDK, no database driver, no secret of the platform's: the gateway holds only its
# own session key and the invite store (ADR-097, ADR-079).
dependencies = [
    "service-ops-common",
    "fastapi>=0.115.2",
    "httpx>=0.28.1",
    # ID tokens for the orchestrator call and the Secret Manager REST read, both lazy.
    "google-auth[requests]>=2.40",
    "uvicorn>=0.31",
    # The daily cap counts by Pacific-time day; slim images carry no tz database.
    "tzdata==2026.4",
]

# Siblings resolve to the workspace members, never PyPI.
[tool.uv.sources]
service-ops-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_gateway"]
