[project]
name = "mcp-feedback"
version = "0.1.0"
description = "Feedback MCP server: sentiment from stored bert_v1 predictions, scored on arrival, as app_sentiment (ADR-008, ADR-023, ADR-067)"
requires-python = ">=3.12"
# The MCP SDK is pinned exactly (R-12, ADR-047). The model stack shares the root `bert`
# extra's exact pins, and torch resolves from the CPU index declared in the workspace
# root (ADR-065), so no CUDA package enters the lock or the image.
dependencies = [
    "mcp==2.2.0",
    "db-models",
    "service-ops-common",
    "service-ops-schemas",
    "SQLAlchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "anyio>=4.9",
    "uvicorn>=0.31",
    "numpy==2.5.3",
    "safetensors==0.8.0",
    "tokenizers==0.23.2",
    "torch==2.14.1",
    "transformers==5.18.0",
]

# Siblings resolve to the workspace members, never PyPI.
[tool.uv.sources]
db-models = { workspace = true }
service-ops-common = { workspace = true }
service-ops-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_feedback"]
