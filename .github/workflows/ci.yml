name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Installs exactly as local development does (CLAUDE.md): every workspace member and
# extra, at the versions in uv.lock (ADR-047). No .env, no API keys: nothing here calls
# a model.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # --locked: fail if uv.lock is stale against any pyproject.toml, never re-resolve.
      - name: Install (from uv.lock)
        run: |
          uv sync --locked --all-packages --all-extras --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: ruff check
        run: ruff check packages data tests services
      - name: ruff format --check
        run: ruff format --check packages data tests services

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # --locked: fail if uv.lock is stale against any pyproject.toml, never re-resolve.
      - name: Install (from uv.lock)
        run: |
          uv sync --locked --all-packages --all-extras --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # Includes each service's own tests/ and the compose isolation test, which calls
      # `docker compose config` (Docker is preinstalled on ubuntu-latest).
      - name: Unit tests (offline)
        run: python -m pytest tests/unit services -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_admin_ephemeral
          POSTGRES_DB: service_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d service_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # EPHEMERAL, CI-ONLY VALUES. They exist only for this job's throwaway Postgres
      # service container, which is destroyed when the job ends; they are not secrets and
      # match nothing outside CI. ADR-028 requires every role name and password to be set,
      # so the roles migration gets explicit values here. Never the real .env.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: service_ops
      POSTGRES_ADMIN_USER: ci_admin
      POSTGRES_ADMIN_PASSWORD: ci_admin_ephemeral
      DB_ROLE_REPORTING_USER: app_reporting
      DB_ROLE_REPORTING_PASSWORD: ci_reporting_ephemeral
      DB_ROLE_SENTIMENT_USER: app_sentiment
      DB_ROLE_SENTIMENT_PASSWORD: ci_sentiment_ephemeral
      DB_ROLE_FORECAST_USER: app_forecast
      DB_ROLE_FORECAST_PASSWORD: ci_forecast_ephemeral
      DB_ROLE_QA_USER: app_qa
      DB_ROLE_QA_PASSWORD: ci_qa_ephemeral
      DB_ROLE_GENERATOR_USER: app_generator
      DB_ROLE_GENERATOR_PASSWORD: ci_generator_ephemeral
      # Missing, unreachable or unmigrated database = failure here, never a skip.
      REQUIRE_INTEGRATION_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # --locked: fail if uv.lock is stale against any pyproject.toml, never re-resolve.
      - name: Install (from uv.lock)
        run: |
          uv sync --locked --all-packages --all-extras --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: alembic upgrade head
        run: python -m alembic upgrade head
      - name: alembic check
        run: python -m alembic check
      # generate.py + load.py as app_generator: ~15 s locally. Timed here so the budget
      # (under 60 s, or the MCP figures test goes back to local-only) stays visible.
      - name: Load dataset (generate + load)
        run: |
          start=$(date +%s)
          python data/generator/load.py --corpus data/generator/corpus/feedback_text.jsonl
          echo "generate + load took $(( $(date +%s) - start ))s"
      - name: Integration tests (live database, skips fail)
        run: python -m pytest tests/integration -q -rs
